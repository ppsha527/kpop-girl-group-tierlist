<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KPOP女團 Tier List</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
/* ── Logo 配色：深海藍 #0e1a2e 背景、橙銅 #c87941 強調色 ── */
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#0e1a2e;color:#f1ede8;min-height:100vh}
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;border-bottom:0.5px solid rgba(200,121,65,0.2);background:#091422}
.logo{font-size:26px;font-weight:500;letter-spacing:0.5px}
.logo span{color:#c87941}
.top-nav{display:flex;gap:6px}
.nav-tab{padding:6px 16px;border-radius:8px;border:0.5px solid rgba(200,121,65,0.3);background:transparent;color:rgba(241,237,232,0.45);font-size:13px;cursor:pointer;transition:all 0.15s}
.nav-tab.active{background:#c87941;color:#fff;border-color:#c87941}
.nav-tab:hover:not(.active){background:rgba(200,121,65,0.1);color:#f1ede8}
.page{display:none;padding:24px}
.page.active{display:block}
.purple-btn{padding:7px 14px;background:#c87941;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;transition:background 0.15s}
.purple-btn:hover{background:#a8632f}
.ghost-btn{padding:7px 13px;border:0.5px solid rgba(200,121,65,0.35);border-radius:8px;font-size:13px;cursor:pointer;background:transparent;color:#f1ede8;white-space:nowrap;transition:background 0.15s}
.ghost-btn:hover{background:rgba(200,121,65,0.1)}
/* board page — 16:9 frame */
#page-board{padding:0 !important;height:calc(100vh - 53px);display:none;flex-direction:column}
#page-board.active{display:flex}
.board-outer{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:10px 10px 4px;overflow:auto;background:#0e1a2e;min-height:0;gap:8px}
.board-frame{background:#091422;border-radius:10px;overflow:visible;box-shadow:0 4px 24px rgba(0,0,0,0.4);flex-shrink:0}
/* tier board */
.tier-section{position:relative}
.tier-section.custom-tier .tier-label-wrap{cursor:grab}
.tier-section.custom-tier .tier-label-wrap:active{cursor:grabbing}
.tier-drag-handle{display:none}
.tier-label-wrap{position:relative;flex-shrink:0;display:flex;flex-direction:column}
.tier-row{display:flex;align-items:stretch;border-bottom:1px solid rgba(200,121,65,0.08);overflow:visible}
.tier-items{flex:1;display:flex;flex-wrap:wrap;align-items:flex-start;align-content:flex-start;gap:4px;padding:4px 6px;background:rgba(255,255,255,0.02);transition:background 0.15s;overflow:visible;height:auto!important}
.tier-items.drag-over{background:rgba(200,121,65,0.1)}
.tier-label-wrap{position:relative;flex-shrink:0}
.tier-label{width:100%;flex:1;display:flex;align-items:center;justify-content:center;font-weight:600;cursor:pointer;user-select:none;min-height:var(--tier-h,60px)}
.tier-label-input{display:none;width:100%;flex:1;background:transparent;border:none;color:inherit;font-weight:600;text-align:center;outline:none;cursor:text;min-height:var(--tier-h,60px)}
.tier-label-wrap.editing .tier-label{display:none}
.tier-label-wrap.editing .tier-label-input{display:flex;align-items:center;justify-content:center}
/* pool */
.pool-wrap{width:100%;flex-shrink:0}
.pool-label{font-size:11px;color:rgba(200,121,65,0.6);margin-bottom:4px;letter-spacing:0.5px}
.pool-items{display:flex;flex-wrap:wrap;gap:4px;padding:6px;background:rgba(255,255,255,0.02);border:0.5px dashed rgba(200,121,65,0.25);border-radius:8px;min-height:50px;transition:background 0.15s;overflow:visible}
.pool-items.drag-over{background:rgba(200,121,65,0.08)}
.board-actions{display:flex;gap:8px;flex-shrink:0}
/* cards — size set by JS */
.icard{position:relative;cursor:grab;flex-shrink:0}
.icard:active{cursor:grabbing}
.icard-img{border-radius:6px;border:2px solid transparent;transition:border-color 0.15s;background:rgba(255,255,255,0.05);display:flex;align-items:center;justify-content:center;overflow:hidden;color:rgba(241,237,232,0.2);font-size:10px}
.icard-img img{width:100%;height:100%;object-fit:cover}
.icard:hover .icard-img{border-color:#c87941}
.icard-name{font-size:10px;color:rgba(241,237,232,0.45);text-align:center;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tooltip{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:#091422;border:0.5px solid rgba(200,121,65,0.4);border-radius:8px;padding:7px 9px;width:130px;pointer-events:none;opacity:0;transition:opacity 0.15s;z-index:999;white-space:pre-wrap}
.icard:hover .tooltip{opacity:1}
.tt-name{font-size:11px;font-weight:500;color:#c87941;margin-bottom:2px}
.tt-desc{font-size:10px;color:#a89880;line-height:1.4}
.dragging{opacity:0.35}
/* preview page — fills viewport, no scroll */
#page-preview{padding:0 !important;height:calc(100vh - 53px);display:none;flex-direction:column}
#page-preview.active{display:flex}
.preview-outer{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:12px;overflow-y:auto;background:#0e1a2e;min-height:0}
.preview-wrap{position:relative;background:#091422;border-radius:10px;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,0.5)}
.empty-hint{font-size:12px;color:rgba(241,237,232,0.2);font-style:italic}
</style>
</head>
<body>

<div class="top-bar">
  <div class="logo"><span>KPOP女團</span> Tier List</div>
  <div class="top-nav">
    <button class="nav-tab active" onclick="gotoPage('board')">製作</button>
    <button class="nav-tab" onclick="gotoPage('preview')">預覽 / 下載</button>
  </div>
</div>

<div class="page active" id="page-board">
  <div class="board-outer" id="board-outer">
    <div class="board-frame" id="board-frame">
      <div id="tier-board"></div>
    </div>
    <div class="pool-wrap" id="pool-wrap">
      <div class="pool-items" id="pool"
        ondragover="onOver(event,this)"
        ondrop="onDrop(event,this)"
        ondragleave="onLeave(this)">
      </div>
    </div>
    <div class="board-actions">
      <button class="purple-btn" onclick="quickAdd()">新增圖片</button>
      <button class="ghost-btn" onclick="addTier()">＋ 新增 Tier</button>
    </div>
  </div>
</div>

<div class="page" id="page-preview">
  <div class="preview-outer">
    <div style="display:flex;flex-direction:column;align-items:center;gap:12px;width:100%">
      <div class="preview-wrap" id="preview-wrap">
        <div id="preview-board"></div>
      </div>
      <button class="purple-btn" style="font-size:14px;padding:9px 28px;flex-shrink:0" onclick="downloadImg()">⬇ 下載圖片</button>
    </div>
  </div>
</div>

// ═══════════════════════════════════════════════
//  Tier 等級設定（S~D 不可拖移，新增的可以）
//  label — 顯示在左側的等級名稱（點兩下可即時修改）
//  bg    — 背景色  tx — 文字色
// ═══════════════════════════════════════════════
let TIERS = [
  { id:'t0', label:'S', bg:'#ff6b6b', tx:'#fff', fixed:true },
  { id:'t1', label:'A', bg:'#ff9f43', tx:'#fff', fixed:true },
  { id:'t2', label:'B', bg:'#feca57', tx:'#2d2d2d', fixed:true },
  { id:'t3', label:'C', bg:'#48dbfb', tx:'#1a3a40', fixed:true },
  { id:'t4', label:'D', bg:'#54a0ff', tx:'#fff', fixed:true },
];
// ═══════════════════════════════════════════════

let items = presets.map((p, i) => ({ ...p, id: 'p' + i }));
items.sort((a, b) => a.name.localeCompare(b.name));
let counter = items.length;
let tierCounter = TIERS.length;

let tierData = {};
TIERS.forEach(t => { tierData[t.id] = []; });
let poolIds = items.map(i => i.id);
let draggingId = null;
let draggingTierId = null;
let _boardCache = null; // 快取製作頁尺寸

function newId() { return 'q' + (counter++); }
function newTierId() { return 'cx' + (tierCounter++); }
function getItem(id) { return items.find(i => i.id === id); }

function makeIcard(id, sz) {
  const item = getItem(id);
  if (!item) return document.createElement('div');
  const cardSz = sz || parseInt(getComputedStyle(document.documentElement).getPropertyValue('--card-sz')) || 60;
  const div = document.createElement('div');
  div.className = 'icard'; div.draggable = true; div.dataset.id = id;
  div.style.width = cardSz + 'px';
  const imgWrap = document.createElement('div'); imgWrap.className = 'icard-img';
  imgWrap.style.width = cardSz + 'px'; imgWrap.style.height = cardSz + 'px';
  if (item.url) {
    const img = document.createElement('img'); img.src = item.url; img.crossOrigin = 'anonymous';
    imgWrap.appendChild(img);
  } else { imgWrap.textContent = '無圖'; }
  const nameEl = document.createElement('div'); nameEl.className = 'icard-name';
  nameEl.style.width = cardSz + 'px'; nameEl.textContent = item.name;
  const tt = document.createElement('div'); tt.className = 'tooltip';
  tt.innerHTML = `<div class="tt-name">${item.name}</div>${item.desc ? `<div class="tt-desc">${item.desc}</div>` : ''}`;
  div.appendChild(imgWrap); div.appendChild(nameEl); div.appendChild(tt);
  div.addEventListener('dragstart', e => { draggingId = id; draggingTierId = null; setTimeout(() => div.classList.add('dragging'), 0); });
  div.addEventListener('dragend', () => { div.classList.remove('dragging'); draggingId = null; });
  return div;
}

function onOver(e, el) { e.preventDefault(); el.classList.add('drag-over'); }
function onLeave(el) { el.classList.remove('drag-over'); }

function onDrop(e, el) {
  e.preventDefault(); el.classList.remove('drag-over');
  // tier reorder drop
  if (draggingTierId) {
    const targetSec = el.closest('.tier-section');
    if (!targetSec) return;
    const targetId = targetSec.dataset.tid;
    if (targetId === draggingTierId) return;
    const fromIdx = TIERS.findIndex(t => t.id === draggingTierId);
    const toIdx = TIERS.findIndex(t => t.id === targetId);
    if (fromIdx < 0 || toIdx < 0) return;
    const [moved] = TIERS.splice(fromIdx, 1);
    TIERS.splice(toIdx, 0, moved);
    renderBoard();
    return;
  }
  if (!draggingId) return;
  const id = draggingId;
  TIERS.forEach(t => { tierData[t.id] = tierData[t.id].filter(x => x !== id); });
  poolIds = poolIds.filter(x => x !== id);
  if (el.id === 'pool') {
    const cards = [...el.querySelectorAll('.icard')];
    const after = getDragAfterElement(el, e.clientX, e.clientY, cards);
    if (after) { const idx = poolIds.indexOf(after.dataset.id); poolIds.splice(idx, 0, id); }
    else poolIds.push(id);
  } else {
    const tid = el.id.replace('tier-', '');
    if (tierData[tid]) {
      const cards = [...el.querySelectorAll('.icard')];
      const after = getDragAfterElement(el, e.clientX, e.clientY, cards);
      if (after) { const idx = tierData[tid].indexOf(after.dataset.id); tierData[tid].splice(idx, 0, id); }
      else tierData[tid].push(id);
    }
  }
  renderBoard();
}

function getDragAfterElement(container, x, y, cards) {
  return cards.reduce((closest, child) => {
    const box = child.getBoundingClientRect();
    const offsetX = x - (box.left + box.width / 2);
    const offsetY = y - (box.top + box.height / 2);
    const dist = Math.sqrt(offsetX ** 2 + offsetY ** 2);
    if ((offsetX < 0 || offsetY < 0) && dist < closest.dist) return { dist, el: child };
    return closest;
  }, { dist: Infinity, el: null }).el;
}

function makeTierLabelWrap(t) {
  const wrap = document.createElement('div');
  wrap.className = 'tier-label-wrap';
  wrap.style.background = t.bg;
  const lbl = document.createElement('div');
  lbl.className = 'tier-label'; lbl.textContent = t.label; lbl.style.color = t.tx;
  lbl.style.fontSize = 'var(--fsz, 16px)';
  lbl.title = '點兩下可修改名稱';
  const input = document.createElement('input');
  input.type = 'text'; input.className = 'tier-label-input'; input.value = t.label; input.style.color = t.tx;
  input.style.fontSize = 'var(--fsz, 16px)';
  lbl.addEventListener('dblclick', () => { wrap.classList.add('editing'); input.focus(); input.select(); });
  input.addEventListener('blur', () => {
    const val = input.value.trim() || t.label;
    t.label = val; lbl.textContent = val; input.value = val;
    wrap.classList.remove('editing');
  });
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') input.blur();
    if (e.key === 'Escape') { input.value = t.label; input.blur(); }
  });
  if (!t.fixed) {
    const del = document.createElement('button');
    del.textContent = '✕';
    del.title = '刪除此 Tier';
    del.style.cssText = 'position:absolute;top:3px;right:3px;width:18px;height:18px;border:none;border-radius:50%;background:rgba(0,0,0,0.5);color:#fff;font-size:10px;cursor:pointer;line-height:1;padding:0;display:flex;align-items:center;justify-content:center;z-index:10';
    del.addEventListener('click', e => {
      e.stopPropagation();
      if (!confirm(`確定刪除「${t.label}」Tier？裡面的圖片會回到備選區。`)) return;
      // 將 tier 內圖片歸還備選區
      (tierData[t.id] || []).forEach(id => poolIds.push(id));
      delete tierData[t.id];
      TIERS = TIERS.filter(x => x.id !== t.id);
      renderBoard();
    });
    wrap.style.position = 'relative';
    wrap.appendChild(del);
  }
  wrap.appendChild(lbl); wrap.appendChild(input);
  return wrap;
}

function calcBoardSizes() {
  const outer = document.getElementById('board-outer');
  if (!outer) return {};
  const ow = outer.clientWidth - 20;
  const oh = outer.clientHeight;
  // 製作頁：寬度決定比例，高度自動
  const poolH = 130;
  const W = Math.min(ow, (oh - poolH) * 16/9);
  const H = W * 9 / 16; // 僅供參考，board-frame 不限高
  const LBSZ = Math.max(Math.round(W * 52/1280), 36);
  // card 大小以 W 決定，讓一排約放 10~12 個
  const CARD = Math.max(Math.round(W / 14), 36);
  const TIER_H = CARD + 20; // 單排高度（圖＋padding）
  const FSZ = Math.max(Math.round(W * 18/1280), 10);
  return { W, H, LBSZ, TIER_H, CARD, FSZ };
}

function renderBoard() {
  const { W, H, LBSZ, TIER_H, CARD, FSZ } = calcBoardSizes();
  const frame = document.getElementById('board-frame');
  if (frame && W) {
    frame.style.width = W + 'px';
    frame.style.height = 'auto'; // 高度跟著內容走
  }

  // update icard size via CSS variable
  const cardSz = CARD || 60;
  document.documentElement.style.setProperty('--card-sz', cardSz + 'px');
  document.documentElement.style.setProperty('--lbsz', (LBSZ||52) + 'px');
  document.documentElement.style.setProperty('--tier-h', (TIER_H||80) + 'px');
  document.documentElement.style.setProperty('--fsz', (FSZ||14) + 'px');

  const board = document.getElementById('tier-board'); board.innerHTML = '';
  board.style.cssText = `display:flex;flex-direction:column;gap:3px;padding:3px;`;

  TIERS.forEach(t => {
    const sec = document.createElement('div');
    sec.className = 'tier-section' + (t.fixed ? '' : ' custom-tier');
    sec.dataset.tid = t.id;
    const row = document.createElement('div'); row.className = 'tier-row';
    row.style.cssText = `min-height:${TIER_H}px;border-radius:6px;overflow:visible;border:none;align-items:stretch`;

    const labelWrap = makeTierLabelWrap(t);
    labelWrap.style.cssText += `;width:${LBSZ}px;min-width:${LBSZ}px`;
    if (!t.fixed) {
      labelWrap.draggable = true;
      labelWrap.addEventListener('dragstart', e => {
        draggingTierId = t.id; draggingId = null;
        setTimeout(() => sec.style.opacity = '0.5', 0);
      });
      labelWrap.addEventListener('dragend', () => { sec.style.opacity = '1'; draggingTierId = null; });
    }
    row.appendChild(labelWrap);

    const zone = document.createElement('div'); zone.className = 'tier-items'; zone.id = 'tier-' + t.id;
    zone.style.minHeight = TIER_H + 'px'; zone.style.height = 'auto';
    zone.ondragover = e => onOver(e, zone); zone.ondrop = e => onDrop(e, zone); zone.ondragleave = () => onLeave(zone);
    row.ondragover = e => { if(draggingTierId) e.preventDefault(); };
    row.ondrop = e => { if(draggingTierId) onDrop(e, row); };
    if (!tierData[t.id].length) {
      const hint = document.createElement('span'); hint.className = 'empty-hint'; hint.textContent = '';
      zone.appendChild(hint);
    } else tierData[t.id].forEach(id => zone.appendChild(makeIcard(id, cardSz)));
    row.appendChild(zone); sec.appendChild(row); board.appendChild(sec);
  });

  const pool = document.getElementById('pool'); pool.innerHTML = '';
  if (!poolIds.length) pool.innerHTML = '<span class="empty-hint">所有項目已分類完畢</span>';
  else poolIds.forEach(id => pool.appendChild(makeIcard(id, cardSz)));
  // 快取尺寸供預覽使用
  _boardCache = { W, H, LBSZ, TIER_H, CARD, FSZ };
}

window.addEventListener('resize', () => { if (document.getElementById('page-board').classList.contains('active')) renderBoard(); });

function addTier() {
  const label = prompt('新 Tier 名稱：');
  if (!label || !label.trim()) return;
  const colors = ['#a29bfe','#fd79a8','#00cec9','#e17055','#6c5ce7','#00b894','#fdcb6e'];
  const bg = colors[tierCounter % colors.length];
  const id = newTierId();
  TIERS.push({ id, label: label.trim(), bg, tx: '#fff', fixed: false });
  tierData[id] = [];
  renderBoard();
}

function quickAdd() {
  const name = prompt('名稱：');
  if (!name || !name.trim()) return;
  const url = prompt('圖片網址：');
  if (!url || !url.trim()) return;
  const id = newId();
  items.push({ id, name: name.trim(), desc: '', url: url.trim() });
  poolIds.push(id);
  renderBoard();
}

function renderPreview() {
  const outer = document.querySelector('.preview-outer');
  const wrap  = document.getElementById('preview-wrap');
  const board = document.getElementById('preview-board');

  // 寬度填滿，高度由內容決定
  const ow = outer.clientWidth - 20;
  const W  = ow;

  // 用快取的製作頁尺寸
  const _c = _boardCache || calcBoardSizes();
  const bW = _c.W || 1280, CARD = _c.CARD || 60, bLBSZ = _c.LBSZ || 52, FSZ = _c.FSZ || 14;
  const sc = W / (bW || 1280);

  const imgSZ    = Math.max(Math.round(CARD   * sc), 6);
  const LBSZ     = Math.max(Math.round(bLBSZ  * sc), 16);
  const imgPad   = Math.max(Math.round(4  * sc), 1);
  const zonePad  = Math.max(Math.round(4  * sc), 1);
  const gap      = Math.max(Math.round(3  * sc), 1);
  const hdrH     = Math.max(Math.round(56 * sc), 20);
  const labelFSZ = Math.max(Math.round(FSZ   * sc), 6);
  const titleSZ  = Math.max(Math.round(28 * sc), 10);
  const logoSZ   = Math.max(Math.round(44 * sc), 14);
  const PAD      = Math.max(Math.round(3  * sc), 1);

  const visibleTiers = TIERS.filter(t => tierData[t.id] && tierData[t.id].length > 0);

  const zoneW = W - PAD*2 - LBSZ;
  const perRow = Math.max(Math.floor((zoneW + imgPad) / (imgSZ + imgPad)), 1);
  function rowsFor(ids) { return Math.ceil((ids.length || 1) / perRow); }

  // Tier 高度：每排 = imgSZ + padding，不壓縮
  const rowH = imgSZ + zonePad * 2;

  // 計算總高度
  const totalH = hdrH + PAD * 2 + gap * (visibleTiers.length - 1)
    + visibleTiers.reduce((s, t) => s + rowsFor(tierData[t.id]) * rowH, 0);

  wrap.style.width  = W + 'px';
  wrap.style.height = totalH + 'px';  // 高度跟著內容

  board.innerHTML = '';
  board.style.cssText = `width:${W}px;height:${totalH}px;background:#091422;display:flex;flex-direction:column;padding:${PAD}px;gap:${gap}px;overflow:visible;font-family:system-ui,sans-serif`;

  // header
  const hdr = document.createElement('div');
  hdr.style.cssText = `display:flex;align-items:center;gap:${Math.round(10*sc)}px;height:${hdrH}px;flex-shrink:0;border-bottom:1px solid rgba(200,121,65,0.2);margin-bottom:${Math.round(2*sc)}px`;
  const li = document.createElement('img');
  li.src = LOGO_B64; li.crossOrigin='anonymous';
  li.style.cssText = `width:${logoSZ}px;height:${logoSZ}px;border-radius:50%;object-fit:cover;flex-shrink:0`;
  const tt = document.createElement('div');
  tt.style.cssText = `font-size:${titleSZ}px;font-weight:700;color:#f1ede8;letter-spacing:0.5px`;
  tt.textContent = 'KPOP女團 Tier List';
  hdr.appendChild(li); hdr.appendChild(tt);
  board.appendChild(hdr);

  if (!visibleTiers.length) {
    const em = document.createElement('div');
    em.style.cssText = 'flex:1;display:flex;align-items:center;justify-content:center;font-size:14px;color:rgba(241,237,232,0.3);font-style:italic';
    em.textContent = '尚未將任何圖片排入 Tier';
    board.appendChild(em);
    return;
  }

  visibleTiers.forEach(t => {
    const ids  = tierData[t.id];
    const tH   = rowsFor(ids) * rowH;

    const row = document.createElement('div');
    row.style.cssText = `display:flex;align-items:stretch;height:${tH}px;flex-shrink:0;border-radius:${Math.max(Math.round(4*sc),2)}px;overflow:hidden`;

    const lbl = document.createElement('div');
    lbl.style.cssText = `width:${LBSZ}px;min-width:${LBSZ}px;display:flex;align-items:center;justify-content:center;font-size:${labelFSZ}px;font-weight:700;background:${t.bg};color:${t.tx};flex-shrink:0`;
    lbl.textContent = t.label;
    row.appendChild(lbl);

    const zone = document.createElement('div');
    zone.style.cssText = `flex:1;display:flex;align-items:flex-start;align-content:flex-start;flex-wrap:wrap;gap:${imgPad}px;padding:${zonePad}px;background:rgba(255,255,255,0.03);overflow:hidden`;

    ids.forEach(id => {
      const item = getItem(id); if (!item) return;
      const cd = document.createElement('div');
      cd.style.cssText = `width:${imgSZ}px;height:${imgSZ}px;border-radius:${Math.max(Math.round(4*sc),2)}px;overflow:hidden;border:1px solid rgba(200,121,65,0.2);background:rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:center;flex-shrink:0`;
      if (item.url) { const im=document.createElement('img'); im.src=item.url; im.crossOrigin='anonymous'; im.style.cssText='width:100%;height:100%;object-fit:cover'; cd.appendChild(im); }
      else cd.textContent='無圖';
      zone.appendChild(cd);
    });

    row.appendChild(zone);
    board.appendChild(row);
  });
}

function gotoPage(p) {
  document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(el => el.classList.remove('active'));
  document.getElementById('page-' + p).classList.add('active');
  document.querySelectorAll('.nav-tab')[p === 'board' ? 0 : 1].classList.add('active');
  if (p === 'preview') renderPreview();
  if (p === 'board') renderBoard();
}

function downloadImg() {
  const board = document.getElementById('preview-board');
  const rect  = board.getBoundingClientRect();
  html2canvas(board, {
    backgroundColor: '#091422',
    scale: 2,          // 2x 解析度，清晰
    useCORS: true,
    allowTaint: true,
    logging: false,
    width:  rect.width,
    height: rect.height
  }).then(canvas => {
    const a = document.createElement('a');
    a.download = 'tierlist.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
  });
}

renderBoard();
